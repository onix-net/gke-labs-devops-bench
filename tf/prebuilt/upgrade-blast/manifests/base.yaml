# upgrade-blast seed: A CORRECT CHANGE THAT EXPOSED LATENT DEBT. ingress-nginx itself
# is installed by scripts/setup.sh (upstream kind-specific manifest, then annotated
# with the CVE this seed exists to protect). This file is the edge namespace, five
# tiny agnhost backends listening on 8080, and the three Ingresses.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
# ---------------------------------------------------------------------------
# Backends. registry.k8s.io/e2e-test-images/agnhost's `netexec` subcommand serves
# plain HTTP on an arbitrary port with zero configuration, which is all these need:
# something ingress-nginx can route to. None of them are involved in the defect --
# the defect is entirely in the Ingresses' pathType, not in what they route to.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: edge
  labels:
    app: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-svc
  namespace: edge
spec:
  selector:
    app: storefront
  ports:
    - port: 8080
      targetPort: 8080
---
