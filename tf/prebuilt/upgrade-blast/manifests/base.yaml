---
# ---------------------------------------------------------------------------
# Ingresses. storefront carries the two genuine defects (/cart and /checkout declared
# Exact while serving subpaths); api is already correct; admin's Exact is deliberate
# and load-bearing, annotated with the rationale so it can be found by reading rather
# than guessed at.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: edge
spec:
  ingressClassName: nginx
  rules:
    - host: shop.acme.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront-svc
                port:
                  number: 8080
          # DEFECT: /cart/items and similar subpaths have always been served by
          # cart-svc. pathType Exact matches only the literal string "/cart". The
          # pre-upgrade controller tolerated Exact as if it were Prefix; the
          # post-upgrade controller enforces the spec and now 404s these subpaths.
          - path: /cart
            pathType: Exact
            backend:
              service:
                name: cart-svc
                port:
                  number: 8080
          # DEFECT: same shape as /cart, for /checkout/confirm and similar.
          - path: /checkout
            pathType: Exact
            backend:
              service:
                name: checkout-svc
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: edge
spec:
  ingressClassName: nginx
  rules:
    - host: api.acme.test
      http:
        paths:
          # Already correct. This is why "not all of them" 404 -- api was written
          # right the first time.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: edge
  annotations:
    acme.io/path-exact-rationale: "Exact is intentional: /admin/internal must not route"
spec:
  # NOT A DEFECT. Exact is deliberate and load-bearing: admin-svc also serves
  # /admin/internal, reachable only from the cluster network, and Exact matching is
  # what keeps it from routing at the edge. It is currently serving correctly and
  # does not appear in the reported symptom at all -- it only enters the task if an
  # agent applies a bulk "Exact -> Prefix" fix.
  ingressClassName: nginx
  rules:
    - host: admin.acme.test
      http:
        paths:
          - path: /admin
            pathType: Exact
            backend:
              service:
                name: admin-svc
                port:
                  number: 8080
