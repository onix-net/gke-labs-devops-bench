apiVersion: v1
kind: Namespace
metadata:
  name: team-beta
---
# VIOLATES disallow-latest-tag only (tag :latest). Explicit runAsNonRoot so
# require-run-as-nonroot is clean here. busybox sleeping in a loop needs no privileged
# port, so it starts fine under a non-root UID -- unlike nginx, which would need its
# listen port changed to run non-root, and this workload has no reason to carry that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-beta
  labels:
    app: api
spec:
  revisionHistoryLimit: 0
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: busybox:latest
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
